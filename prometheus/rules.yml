groups:
  - name: industrial-lab
    rules:
      - alert: OPCUAConnectionLost
        expr: bridge_opcua_connected == 0
        for: 15s
        labels: {severity: critical}
        annotations: {summary: 'Edge bridge cannot read the PLC'}
      - alert: MotorOverheating
        expr: factory_motor_temperature_c > 80
        for: 15s
        labels: {severity: critical}
        annotations: {summary: 'Motor temperature exceeds 80 C'}
      - alert: ExcessiveVibration
        expr: factory_motor_vibration_g > 0.5
        for: 15s
        labels: {severity: warning}
        annotations: {summary: 'Motor vibration exceeds 0.5 g'}
      - alert: ProductionLineBlocked
        expr: factory_blocked_sensor == 1
        for: 10s
        labels: {severity: critical}
        annotations: {summary: 'Line 1 blocked sensor is active'}
      - alert: QualityDegradation
        expr: factory_quality_score < 0.9
        for: 20s
        labels: {severity: warning}
        annotations: {summary: 'Product quality below 90 percent'}
      - alert: CameraStreamDown
        expr: cv_stream_up == 0
        for: 15s
        labels: {severity: critical}
        annotations: {summary: 'CV cannot decode the RTSP stream'}
      - alert: ComputerVisionAnomaly
        expr: cv_anomaly_detected == 1 and cv_stream_up == 1
        for: 15s
        labels: {severity: warning}
        annotations: {summary: 'Visual anomaly or degraded camera image'}
      - alert: MLAnomaly
        expr: ml_anomaly_detected == 1 and (time() - ml_last_input_timestamp_seconds < 15)
        for: 20s
        labels: {severity: warning}
        annotations: {summary: 'IsolationForest detected unusual telemetry'}
      - alert: TelemetryStale
        expr: time() - ml_last_input_timestamp_seconds > 20
        for: 15s
        labels: {severity: warning}
        annotations: {summary: 'ML has no recent telemetry input'}
      - alert: EndpointUnavailable
        expr: probe_success == 0
        for: 15s
        labels: {severity: critical}
        annotations: {summary: 'Blackbox endpoint probe failed'}
      - alert: ExporterDown
        expr: up == 0
        for: 20s
        labels: {severity: warning}
        annotations: {summary: 'Prometheus scrape target unavailable'}
      - alert: YOLOModelUnavailable
        expr: yolo_enabled == 1 and yolo_model_ready == 0
        for: 60s
        labels: {severity: warning}
        annotations: {summary: 'Optional YOLO model unavailable; classical CV continues'}
      - alert: PersonInRestrictedZone
        # Exporter flags expire after 3s; allow two 5s scrape intervals here so
        # evaluation/scrape scheduling cannot suppress a continuously fresh signal.
        expr: yolo_restricted_zone_violation == 1 and yolo_enabled == 1 and yolo_model_ready == 1 and cv_stream_up == 1 and (time() - yolo_last_inference_timestamp_seconds < 10)
        for: 5s
        labels: {severity: warning}
        annotations: {summary: 'Demonstration only: person detected overlapping restricted zone'}
      - alert: IncidentDatabaseUnavailable
        expr: incident_database_ready == 0
        for: 15s
        labels: {severity: warning}
        annotations: {summary: 'Incident storage unavailable; Alertmanager retries webhook delivery'}
      - alert: VisionCameraUnavailable
        expr: vision_camera_up == 0
        for: 15s
        labels: {severity: critical}
        annotations: {summary: 'Multi-camera raw video unavailable'}
      - alert: ProductStalled
        expr: vision_stalled_object_detected == 1 and on(camera) vision_tracking_ready == 1
        for: 5s
        labels: {severity: warning}
        annotations: {summary: 'Tracked product stationary while conveyor should be moving'}
      - alert: ProductWrongDirection
        expr: vision_wrong_direction_detected == 1 and on(camera) vision_tracking_ready == 1
        for: 5s
        labels: {severity: warning}
        annotations: {summary: 'Tracked product moving opposite production flow'}
      - alert: ProductExcessiveDwell
        expr: vision_excessive_dwell_detected == 1 and on(camera) vision_tracking_ready == 1
        for: 10s
        labels: {severity: warning}
        annotations: {summary: 'Tracked product exceeded inspection dwell time'}
      - alert: ProductionCountMismatch
        expr: vision_count_mismatch == 1 and vision_count_reconciliation_ready == 1
        for: 5s
        labels: {severity: warning}
        annotations: {summary: 'PLC and observed entry counts differ beyond tolerance and hold'}
      - alert: ProductMissingExit
        expr: vision_missing_exit_detected == 1 and vision_count_reconciliation_ready == 1
        for: 10s
        labels: {severity: warning}
        annotations: {summary: 'Aggregate entry flow has no timely observed exit crossing'}
      - alert: VisualQualityFailure
        expr: vision_quality_failure == 1 and on(camera) vision_camera_up == 1
        for: 5s
        labels: {severity: warning}
        annotations: {summary: 'OpenCV inspection marker orientation out of specification'}
      - alert: VisionPersonInRestrictedZone
        expr: vision_restricted_zone_violation == 1 and on(camera) vision_tracking_ready == 1
        for: 5s
        labels: {severity: warning}
        annotations: {summary: 'Demonstration only - tracked person overlaps restricted zone'}
