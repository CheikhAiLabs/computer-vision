name: Validate local industrial lab
on: [push, pull_request]
permissions:
  contents: read
jobs:
  static-and-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: computer_vision
          POSTGRES_USER: incidents
          POSTGRES_PASSWORD: local-demo-only
        ports: ["127.0.0.1:5432:5432"]
        options: >-
          --health-cmd "pg_isready -U incidents -d computer_vision"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      INCIDENT_TEST_POSTGRES: "true"
      POSTGRES_HOST: localhost
      POSTGRES_DB: computer_vision
      POSTGRES_USER: incidents
      POSTGRES_PASSWORD: local-demo-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q common services tools scripts tests
      - run: python scripts/validate.py
      - run: node --check services/incident_receiver/static/portal.js
      - run: node --check services/incident_receiver/static/openapi.js
      - run: node --check services/cv_detector/static/control_room.js
      - run: docker compose --profile tools config --quiet
      - run: python -m unittest discover -s tests -v
      - name: PowerShell syntax
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/scripts/labctl.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
      - name: Prometheus and Alertmanager configuration
        run: |
          docker compose run --rm --no-deps --entrypoint promtool prometheus check config /etc/prometheus/prometheus.yml
          docker compose run --rm --no-deps --entrypoint amtool alertmanager check-config /etc/alertmanager/alertmanager.yml
