logLevel: info
rtsp: yes
rtspAddress: :8554
rtspTransports: [tcp]
rtmp: no
hls: yes
hlsAddress: :8888
hlsAlwaysRemux: yes
hlsVariant: mpegts
webrtc: no
srt: no
paths:
  line1:
    source: rtsp://127.0.0.1:8554/line1-process
    rtspTransport: tcp
  line1-entry:
    source: publisher
  line1-process:
    source: publisher
  line1-exit:
    source: publisher
